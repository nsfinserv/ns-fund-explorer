name: Private fund analysis (RK only)

# Runs ONLY when started by hand: Actions > Private fund analysis > Run workflow.
# It never runs on a schedule and never publishes to any website
# (no GitHub Pages step, nothing to Netlify or nsfinancialservices.co.in).
# The finished data is locked (encrypted) so only Claude can open it, and saved
# to the "private-analysis" branch. Claude turns it into a private page for RK.

on:
  workflow_dispatch:

permissions:
  contents: write   # only to save the locked data file to the private-analysis branch

concurrency:
  group: private-analysis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Read AMFI's new Plan and Option columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/common.py")
          s = p.read_text()
          if "_with_plan_option" in s:
              print("Parser already reads AMFI's Plan and Option columns")
          else:
              I, J = " " * 20, " " * 24
              old_a = I + 'elif "scheme name" in h:\n' + J + 'cols["name"] = i\n'
              new_a = (I + 'elif "scheme name" in h or h == "nav name":\n' + J + 'cols["name"] = i\n'
                       + I + 'elif h == "plan":\n' + J + 'cols["plan"] = i\n'
                       + I + 'elif h == "option":\n' + J + 'cols["option"] = i\n')
              old_b = 're.sub(r"\\s+", " ", parts[cols["name"]]).strip() if "name" in cols else ""'
              new_b = '_with_plan_option(parts, cols)'
              helper = r'''def _with_plan_option(parts: list[str], cols: dict[str, int]) -> str:
              """Scheme name plus AMFI's separate Plan and Option columns, when the name does not say them."""
              get = lambda k: re.sub(r"\s+", " ", parts[cols[k]]).strip() if k in cols and cols[k] < len(parts) else ""  # noqa: E731
              name, plan, option = get("name"), get("plan"), get("option")
              low = name.lower()
              if plan and not re.search(r"\b(direct|regular)\b", low):
                  name += " - " + (plan if re.search(r"\bplan\b", plan, re.I) else plan + " Plan")
              if option and not re.search(r"growth|idcw|dividend|bonus|payout", low):
                  name += " - " + option
              return name
          '''
              assert s.count(old_a) == 1 and s.count(old_b) == 1, "parser patch: text not found"
              s = s.replace(old_a, new_a).replace(old_b, new_b)
              s = s.replace("def parse_nav_text(text: str):", helper + "\n\ndef parse_nav_text(text: str):", 1)
              p.write_text(s)
              print("Parser now reads AMFI's Plan and Option columns")
          PY

      - name: Fixes for AMFI's new category names, NAV dates and history
        run: |
          python - <<'PY'
          from pathlib import Path


          def patch(path, pairs, marker):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  print(path, "already fixed")
                  return
              for old, new in pairs:
                  assert s.count(old) == 1, f"{path}: text not found: {old[:60]!r}"
                  s = s.replace(old, new)
              p.write_text(s)
              print(path, "fixed")


          # 1) NAV history: fetch every 90-day piece again with the full fund list. Pieces fetched while
          #    AMFI's new file layout was not read properly were marked done with most funds missing.
          patch("scripts/amfi_fetch.py", [
              ('meta_get(con, "history_mf", {})', 'meta_get(con, "history_mf2", {})'),
              ('meta_set(con, "history_mf", done_mf)', 'meta_set(con, "history_mf2", done_mf)'),
          ], "history_mf2")

          # 2) One name per category: AMFI now mixes old names ("Equity Scheme - Large Cap Fund") and new
          #    ones ("Equity Schemes - Large Cap Fund", "Income/Debt Oriented Schemes - Short Term Fund").
          CANON = r'''

          _CANON_SUB = {
              "Equity Scheme": [("elss", "ELSS (Tax Saver)"), ("sectoral", "Sectoral / Thematic Fund"),
                                ("thematic", "Sectoral / Thematic Fund"), ("large & mid", "Large & Mid Cap Fund"),
                                ("large and mid", "Large & Mid Cap Fund")],
              "Debt Scheme": [("overnight", "Overnight Fund"), ("liquid", "Liquid Fund"),
                              ("money market", "Money Market Fund"), ("ultra short to short", "Ultra Short to Short Term Fund"),
                              ("ultra short", "Ultra Short Term Fund"), ("medium to long", "Medium to Long Term Fund"),
                              ("medium", "Medium Term Fund"), ("low duration", "Low Duration Fund"),
                              ("long", "Long Term Fund"), ("short", "Short Term Fund"), ("dynamic", "Dynamic Term Fund"),
                              ("corporate bond", "Corporate Bond Fund"), ("credit risk", "Credit Risk Fund"),
                              ("banking", "Banking and PSU Debt Fund"), ("10", "10-year Constant Maturity Gilt Fund"),
                              ("gilt", "Gilt Fund"), ("float", "Floating Interest Rates Fund"),
                              ("sectoral", "Sectoral Debt Fund")],
              "Hybrid Scheme": [("balanced advantage", "Balanced Advantage / Dynamic Asset Allocation"),
                                ("dynamic asset", "Balanced Advantage / Dynamic Asset Allocation"),
                                ("multi asset", "Multi Asset Allocation Fund"), ("equity savings", "Equity Savings Fund"),
                                ("arbitrage", "Arbitrage Fund"), ("conservative", "Conservative Hybrid Fund"),
                                ("aggressive", "Aggressive Hybrid Fund"), ("balanced hybrid", "Balanced Hybrid Fund")],
              "Solution Oriented Scheme": [("retire", "Retirement Fund"), ("child", "Children’s Fund")],
          }


          def canon_category(category: str) -> str:
              """One name for each category, whether AMFI's file uses the old or the new category names."""
              g, s = split_category(category)
              gl = re.sub(r"[^a-z/ ]", "", g.lower()).strip()
              if gl.startswith("equity scheme"):
                  g = "Equity Scheme"
              elif gl.startswith("debt scheme") or gl.startswith("income/debt"):
                  g = "Debt Scheme"
              elif gl.startswith("hybrid scheme"):
                  g = "Hybrid Scheme"
              elif gl.startswith("solution oriented"):
                  g = "Solution Oriented Scheme"
              elif gl.startswith("children"):
                  g, s = "Solution Oriented Scheme", "Children’s Fund"
              elif gl.startswith("index fund"):
                  g, s = "Other Scheme", "Index Funds"
              elif gl.startswith("fund of funds") and "domestic" in gl:
                  g, s = "Other Scheme", "FoF Domestic"
              elif "overseas" in gl and "fund of funds" in gl:
                  g, s = "Other Scheme", "FoF Overseas"
              else:
                  return category
              sl = s.lower()
              for key, name in _CANON_SUB.get(g, []):
                  if key in sl:
                      s = name
                      break
              return f"{g} - {s}"
          '''

          patch("scripts/common.py", [
              ('''    "Debt": ["overnight", "liquid", "ultra short", "low duration", "money market",
                       "short duration", "medium duration", "medium to long", "long duration",
                       "dynamic bond", "corporate bond", "credit risk", "banking and psu", "banking & psu",
                       "gilt fund with 10", "gilt", "floater", "sectoral debt"],''',
               '''    "Debt": ["overnight", "liquid", "ultra short to short", "ultra short", "low duration", "money market",
                       "short term", "medium term", "medium to long", "long term", "dynamic", "corporate bond",
                       "credit risk", "banking", "10-year", "gilt", "floating", "sectoral"],'''),
              ("\n\ndef group_of(category: str) -> str:", CANON + "\n\ndef group_of(category: str) -> str:"),
          ], "def canon_category")

          # 3) Build: use the one category name, and take the NAV date most funds have. Liquid and overnight
          #    funds also publish NAVs for the coming weekend, which made every 1, 3 and 5 year return blank.
          patch("scripts/build_data.py", [
              ("from common import (DATA,", "from common import (canon_category, DATA,"),
              ('    sample = (RAW / "SAMPLE").exists()\n',
               '    for s in latest:\n        s["category"] = canon_category(s["category"])\n'
               '    sample = (RAW / "SAMPLE").exists()\n'),
              ('    data_date = max(dt.date.fromisoformat(s["date"]) for s in latest)\n',
               '    _dc = defaultdict(int)\n    for s in latest:\n        _dc[s["date"]] += 1\n'
               '    data_date = dt.date.fromisoformat(max(_dc, key=lambda k: (_dc[k], k)))\n'),
          ], "canon_category(s[")
          PY

      - name: Restore saved NAV history
        uses: actions/cache/restore@v6
        with:
          path: |
            data/store
            data/raw
          key: navstore-${{ github.run_id }}
          restore-keys: navstore-

      - name: Download today's data from AMFI
        run: python scripts/amfi_fetch.py daily

      - name: AMFI risk data for mid and small cap funds
        run: python scripts/amfi_risk.py
        continue-on-error: true

      - name: Portfolios - which fund houses still need last month's file
        id: pf
        run: python scripts/portfolio_fetch.py pending
        continue-on-error: true

      - name: Portfolios - download from fund house websites
        if: steps.pf.outputs.pending != '0'
        run: |
          python -m playwright install --with-deps chromium
          python scripts/portfolio_fetch.py
        env:
          PF_MINUTES: "40"
        timeout-minutes: 55
        continue-on-error: true

      - name: Portfolios - read the files (and anything in portfolios/inbox)
        run: python scripts/portfolio_parse.py --all
        continue-on-error: true

      - name: Fill in older NAV history (continues where it stopped)
        run: python scripts/amfi_fetch.py history --minutes 200
        continue-on-error: true

      - name: Save NAV history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/store
            data/raw
          key: navstore-${{ github.run_id }}

      - name: Build the analysis data
        run: python scripts/build_data.py

      - name: Lock the data so only Claude can open it
        run: |
          cat > /tmp/claude-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAlhjPBJGNUvntWJ//A+1B
          9PIQGeq24PW3QscollyLJZ8cX98TsXlViKo95XxBm5ShdlshUWPV5sS186zUHS8i
          r88+5Dj7iLhoqdC94g5luL/sJA1jCeWLh+BZQSNuG8h8b99gdDke16Ew0V5Lb2/m
          Z6zTX6oHocUABOl8Q/pWfX3979A4IlGhnmsq/iFNw09DoOur+tIRW7PoGLEEnsUV
          3SpeKvOVz6wxKF825h6bnVlecUsA6CD+beRgaJvjn0pDULJyBNg0EZsgdTf2+W5j
          1auj+QHkQptkDBgHQ5OphNBSAimZN05o8sECrug3wPYGkI1wEulAAD8bNW1eewVr
          2n9h98kCLHMPFqtoxliLsF74EiC5RTrq1FDYOxjIyUkyBwuhQi/k6ebzFU4MPFxp
          Uh7dUSL8Z1LN8pHC6QD/mPPegZMveCuno9n8PrXyOf9YXhC3gqiqy1sG/aHPymAP
          gYIBGGWxGMH1VY3ccxNQpp3c3L3ElVKSbzKfFRGJunhXZH72pClja/gK5+M7anO4
          sAbsSyK/q6nDyJnzyxf+RmNARUHIBMNYZn0/iL5tqr4nJSNXvPONmLa/ijiIp/DM
          LPhEK7eH9PDeErNchp4DGWCTToEJvHlpVfIZ59gPHh7sTN53SWggO4HXJKlFRACn
          j3ivkE9vmNKN/hg+CwAVSBECAwEAAQ==
          -----END PUBLIC KEY-----
          KEY
          tar -czf /tmp/data.tgz -C site data
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/data.tgz -out /tmp/data.tgz.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/claude-public.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/key.enc
          rm -f /tmp/k.bin /tmp/data.tgz
          ls -l /tmp/data.tgz.enc /tmp/key.enc

      - name: Save the locked file to the private-analysis branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/locked && cd /tmp/locked
          git init -q -b private-analysis
          cp /tmp/data.tgz.enc /tmp/key.enc .
          printf 'Locked (encrypted) fund analysis data for Claude. Not a website.\nBuilt: %s\n' "$(date -u)" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Locked fund analysis data"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" private-analysis
