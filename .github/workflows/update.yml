name: Update market strip

# Publishes only data/market.json (and a page that sends visitors to nsfinancialservices.co.in).
# The fund explorer pages are no longer published.

on:
  schedule:
    - cron: "40 19 * * *"   # 01:10 IST, after AMFI publishes the day's NAVs
    - cron: "40 1 * * *"    # 07:10 IST, a second try in case AMFI was late
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # only for the weekly marker that keeps the schedule switched on
  pages: write
  id-token: write

concurrency:
  group: market-strip
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Market strip figures from AMFI NAVs
        run: python scripts/market.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Keep the daily schedule switched on
        if: success()
        run: |
          date -u +"Last data update: %Y-%m-%d %H:%M UTC" > last-update.txt
          if [ "$(date -u +%u)" = "7" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-update.txt
            git commit -m "Weekly data update marker" || true
            git push || true
          fi
